e,"id":"ATLAS","owner":"Architecture \u0026 Technology Strategy","scope":"Evaluate whether a legacy Java estate should be modernized. No implementation progress is represented.","subtitle":"Feasibility, effort \u0026 migration worthiness","title":"Atlas modernization assessment"},"questions":{"Q-LEGAL":{"blocking":true,"createdAt":"2026-11-02","dimensionId":"D-DEPS","evidenceRefs":["E-DEPS"],"id":"Q-LEGAL","nextStep":"Request a documented license position.","owner":"Legal liaison","question":"Are candidate replacement licenses acceptable?","revision":1,"sourceRefs":[{"endLine":24,"path":"02-technical-analysis.md","sourceHash":"90f89252abc6b201fdf5cb158bdd4d6d1b1b94744af1303238b5a68ea199b193","startLine":1}],"status":"open","updatedAt":"2026-11-02"},"Q-ROI":{"blocking":true,"createdAt":"2026-11-02","dimensionId":"D-ECON","evidenceRefs":[],"id":"Q-ROI","nextStep":"Validate avoided-cost assumptions.","owner":"Finance partner","question":"What counterfactual cost and benefit horizon should management use?","revision":1,"sourceRefs":[{"endLine":24,"path":"02-technical-analysis.md","sourceHash":"90f89252abc6b201fdf5cb158bdd4d6d1b1b94744af1303238b5a68ea199b193","startLine":1}],"status":"open","updatedAt":"2026-11-02"},"Q-SERIAL":{"blocking":true,"createdAt":"2026-11-02","dimensionId":"D-COMPAT","evidenceRefs":["E-SERIAL"],"id":"Q-SERIAL","nextStep":"Expand production-representative fixture diversity.","owner":"Runtime research lead","question":"Will legacy session fixtures deserialize safely?","revision":2,"sourceRefs":[{"endLine":24,"path":"04-runtime-validation.md","sourceHash":"4836c587a0824ecc17a347f223e3f609fc084dcc121f138f2d97a03c3f6e9ee3","startLine":1}],"status":"answered","updatedAt":"2026-11-09"},"Q-SUPPORT":{"blocking":true,"createdAt":"2026-11-09","dimensionId":"D-SEC","evidenceRefs":["E-DEPS2"],"id":"Q-SUPPORT","nextStep":"Obtain written terms and an approved deny-policy oracle.","owner":"Security \u0026 procurement","question":"Which support terms and security policy oracle are authoritative?","revision":1,"sourceRefs":[{"endLine":16,"path":"05-dependency-and-security-review.md","sourceHash":"fa36424386f9d6d082e9c380ab5db9f61feb31ca0c2d1ba499759061c32228d9","startLine":1}],"status":"open","updatedAt":"2026-11-09"}},"recommendations":{"REC-ATLAS":{"conclusion":"Defer migration commitment; continue focused assessment.","createdAt":"2026-11-02","decisionStatus":"recommended","id":"REC-ATLAS","limitations":["Unknown benefits","No recovery evidence","License exception unresolved"],"rationale":"Technical feasibility is increasingly evidenced, but worthiness is not established without the economic counterfactual and recovery assessment.","revision":2,"sourceRefs":[{"endLine":16,"path":"06-worthiness-reassessment.md","sourceHash":"d0f46f3e79fa31fe4ee5194d66b7f4e3ca71dbcad6649bc4696080cecf27c3c0","startLine":1}],"stance":"defer","supportingFindings":["F-API","F-ADAPTER","F-DEPS"],"updatedAt":"2026-11-09"}},"risks":{"R-SESSION":{"createdAt":"2026-11-09","description":"Stored session incompatibility raises adaptation effort and backward-compatibility uncertainty.","evidenceRefs":["E-SERIAL"],"id":"R-SESSION","impact":"critical","likelihood":"high","mitigationOptions":["Explicit version adapters","Investigate session invalidation trade-offs"],"owner":"Runtime research lead","revision":1,"sourceRefs":[{"endLine":24,"path":"04-runtime-validation.md","sourceHash":"4836c587a0824ecc17a347f223e3f609fc084dcc121f138f2d97a03c3f6e9ee3","startLine":1}],"status":"open","updatedAt":"2026-11-09"},"R-WRAPPERS":{"createdAt":"2026-11-02","description":"Unmaintained wrappers may require custom replacement and increase effort.","evidenceRefs":["E-DEPS"],"id":"R-WRAPPERS","impact":"high","likelihood":"medium","mitigationOptions":["Evaluate maintained alternatives","Isolate through an adapter boundary"],"owner":"Integration research lead","revision":1,"sourceRefs":[{"endLine":24,"path":"02-technical-analysis.md","sourceHash":"90f89252abc6b201fdf5cb158bdd4d6d1b1b94744af1303238b5a68ea199b193","startLine":1}],"status":"open","updatedAt":"2026-11-02"}},"schemaVersion":"1.0","sources":{"01-assessment-charter.md":{"content":"# Assessment charter • baseline, 2 November 2026\n\n\u003e SYNTHETIC CASE STUDY — not vendor guidance or production measurements.\n\n## Decision context\nAtlas is a fictional 28-module Java estate. The assessment compares retaining the present stack, staged modernization, and a replacement. The target is an illustrative Spring 7 / current-generation application-server candidate; this document asserts no real support matrix.\n\n## Scope and measurement contract\nThe six dimensions have business-defined weights totalling 100. An investigation counts as examined only after a documented preliminary result (or an inconclusive outcome), never merely because an agent started it. Planned scope weights are explicit. Coverage is not confidence or feasibility.\n\n## Assumptions and exclusions\n- No code has been migrated as a deliverable of this study.\n- Sample counts, timings, costs and findings below are fabricated to test the module.\n- Benefits, enterprise licensing, and restore readiness still lack defensible measurements.\n\n## Review protocol\nWeekly reports contain the complete current understanding plus structured deltas. An authorized human approves each snapshot; a favorable technical observation alone cannot authorize migration.\n\n```assessment\nprogram:\n  id: ATLAS\n  title: Atlas modernization assessment\n  subtitle: Feasibility, effort \u0026 migration worthiness\n  owner: Architecture \u0026 Technology Strategy\n  scope: Evaluate whether a legacy Java estate should be modernized. No implementation\n    progress is represented.\n  exampleData: true\n  currentRecommendationId: REC-ATLAS\nexecutiveSummary:\n- The compatibility investigation has identified a plausible adaptation route, but\n  no migration decision is justified yet.\n- Dependency and security findings remain preliminary. Economics and operational recovery\n  are materially underexamined.\n- Management should fund targeted validation experiments rather than approve implementation\n  on current evidence.\ndimensions:\n- id: D-COMPAT\n  title: Framework compatibility\n  description: Planned assessment dimension for the Atlas modernization study.\n  scope: API, namespace, serialization and transaction semantics\n  weight: 25\n  coverageStatus: investigating\n  evidenceMaturity: low\n- id: D-DEPS\n  title: Dependency viability\n  description: Planned assessment dimension for the Atlas modernization study.\n  scope: Direct and transitive dependency maintenance and licensing\n  weight: 20\n  coverageStatus: investigating\n  evidenceMaturity: low\n- id: D-PLATFORM\n  title: Runtime \u0026 platform\n  description: Planned assessment dimension for the Atlas modernization study.\n  scope: Representative application-server, JDK and operational fit\n  weight: 15\n  coverageStatus: investigating\n  evidenceMaturity: low\n- id: D-SEC\n  title: Security \u0026 compliance\n  description: Planned assessment dimension for the Atlas modernization study.\n  scope: Security controls, support lifecycle and access boundaries\n  weight: 15\n  coverageStatus: investigating\n  evidenceMaturity: low\n- id: D-ECON\n  title: Effort \u0026 worthiness\n  description: Planned assessment dimension for the Atlas modernization study.\n  scope: Uncertainty-bounded effort, costs, benefits and alternatives\n  weight: 20\n  coverageStatus: investigating\n  evidenceMaturity: low\n- id: D-OPS\n  title: Operational impact\n  description: Planned assessment dimension for the Atlas modernization study.\n  scope: Recovery, observability, on-call and data-handling readiness\n  weight: 5\n  coverageStatus: not-examined\n  evidenceMaturity: unknown\ninvestigations:\n- id: I-API\n  dimensionId: D-COMPAT\n  question: Are API and namespace adaptations bounded?\n  status: preliminary\n  owner: Research team\n  scopeWeight: 2\n  nextStep: Validate a representative transaction slice.\n- id: I-SERIAL\n  dimensionId: D-COMPAT\n  question: Can stored serialized sessions be read?\n  status: not-examined\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Capture legacy session fixtures.\n- id: I-DEPS\n  dimensionId: D-DEPS\n  question: Do maintained replacement libraries exist?\n  status: preliminary\n  owner: Research team\n  scopeWeight: 2\n  nextStep: Reconcile the full transitive inventory.\n- id: I-LICENSE\n  dimensionId: D-DEPS\n  question: Are replacement licenses acceptable?\n  status: investigating\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Request legal review of candidate licenses.\n- id: I-RUNTIME\n  dimensionId: D-PLATFORM\n  question: Does the target runtime host representative workloads?\n  status: investigating\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Run a transaction and recovery experiment.\n- id: I-CAPACITY\n  dimensionId: D-PLATFORM\n  question: Is performance acceptable at peak load?\n  status: not-examined\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Design a replay dataset without customer data.\n- id: I-AUTH\n  dimensionId: D-SEC\n  question: Are authorization semantics equivalent?\n  status: preliminary\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Exercise denied and cross-tenant requests.\n- id: I-SUPPORT\n  dimensionId: D-SEC\n  question: Is the support lifecycle adequate?\n  status: not-examined\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Obtain written support assumptions.\n- id: I-EFFORT\n  dimensionId: D-ECON\n  question: What effort range is defensible?\n  status: preliminary\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Model remediation sensitivity.\n- id: I-ROI\n  dimensionId: D-ECON\n  question: Are benefits and avoided costs worth the effort?\n  status: not-examined\n  owner: Research team\n  scopeWeight: 2\n  nextStep: Validate the counterfactual and benefit horizon.\n- id: I-RECOVERY\n  dimensionId: D-OPS\n  question: Can operations sustain the candidate platform?\n  status: not-examined\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Interview operations and test restore assumptions.\nrecommendations:\n- id: REC-ATLAS\n  conclusion: Recommendation pending; continue targeted assessment.\n  rationale: Compatibility evidence is promising but economics and recovery remain\n    unexplored.\n  supportingFindings:\n  - F-API\n  - F-DEPS\n  limitations:\n  - Sampled modules only\n  - No validated benefit model\n  decisionStatus: pending\n  stance: pending\n```\n","hash":"fa3163929480aa01a20f4d89e78f22636dd136f3901f021d5be2634f117b7ba7"},"02-technical-analysis.md":{"content":"# Technical analysis • inventory and provisional hypotheses\n\n\u003e SYNTHETIC CASE STUDY — not vendor guidance or production measurements.\n\n## Inventory and method\nA synthetic inventory enumerates 28 modules, 187 direct dependencies and 412 transitive nodes. Six representative modules were statically inspected; no assertion of full-estate coverage is made.\n\n| Probe | Sample | Observation | Limitation |\n| --- | ---: | --- | --- |\n| Namespace and API scan | 6 modules | 146 namespace sites, 19 removed API calls | Generated source excluded |\n| Dependency reconciliation | 80% of direct coordinates | 12 replacement candidates, 3 unmaintained wrappers | Transitive licensing incomplete |\n| Security policy walkthrough | 14 role paths | 2 ambiguous deny rules | No runtime validation |\n\n## Preliminary interpretation\nThe initial scan suggests the API work may be bounded. A deliberately fragile hypothesis claims namespace adaptation will preserve session serialization; it has not been tested and must not be read as established compatibility.\n\n## Research priorities\n1. Deserialize representative old sessions on the candidate runtime.\n2. Test transaction rollback across database and queue boundaries.\n3. Review generated authorization code, including negative cases.\n\n## Embedded hostile text for safe rendering\nThe literal text `\u003cscript\u003ewindow.__sourceExecuted = true\u003c/script\u003e` is research content, never executable UI. Names may contain `A \u0026 B \u003cadapter\u003e` and Unicode such as Δ or ₹.\n\n```assessment\nevidence:\n- id: E-SCAN\n  description: Synthetic static namespace/API inventory across six modules.\n  kind: analysis\n  verificationStatus: reviewed\n  capturedAt: '2026-11-02'\n  reviewedBy: Analysis lead\n  limitations: Generated code, persistence metadata and runtime behavior excluded.\n  sourceRefs:\n  - path: '@self'\n    startLine: 5\n    endLine: 23\n- id: E-DEPS\n  description: Synthetic dependency inventory and candidate maintenance scan.\n  kind: analysis\n  verificationStatus: reviewed\n  capturedAt: '2026-11-02'\n  reviewedBy: Analysis lead\n  limitations: Only 80% of direct coordinates reconciled; transitive review pending.\n  sourceRefs:\n  - path: '@self'\n    startLine: 5\n    endLine: 23\n- id: E-ASSUME\n  description: Assumed serialization equivalence after namespace adaptation.\n  kind: assumption\n  verificationStatus: unverified\n  capturedAt: '2026-11-02'\n  reviewedBy: unreviewed\n  limitations: No fixture-based test exists.\n  sourceRefs:\n  - path: '@self'\n    startLine: 5\n    endLine: 23\nfindings:\n- id: F-API\n  investigationId: I-API\n  title: API adaptation appears bounded\n  conclusion: The sampled API surface suggests a manageable adapter layer; estate-wide\n    extrapolation is premature.\n  status: preliminary\n  confidence: medium\n  evidenceRefs:\n  - E-SCAN\n  implications: This informs feasibility and estimated research needs; it is not implementation\n    completion.\n  uncertainties:\n  - Generated code not scanned\n  nextInvestigation: Validate transaction slices.\n  severity: high\n  impact: favorable\n  supersedes: []\n- id: F-SERIAL\n  investigationId: I-SERIAL\n  title: Session compatibility hypothesis\n  conclusion: Namespace-only adaptation is assumed to preserve serialized session\n    behavior.\n  status: preliminary\n  confidence: high\n  evidenceRefs:\n  - E-ASSUME\n  implications: This informs feasibility and estimated research needs; it is not implementation\n    completion.\n  uncertainties:\n  - No deserialization evidence\n  nextInvestigation: Test old session fixtures.\n  severity: critical\n  impact: favorable\n  supersedes: []\n- id: F-DEPS\n  investigationId: I-DEPS\n  title: Unmaintained integration wrappers\n  conclusion: Three candidate wrappers lack a demonstrated maintenance path.\n  status: preliminary\n  confidence: low\n  evidenceRefs:\n  - E-DEPS\n  implications: This informs feasibility and estimated research needs; it is not implementation\n    completion.\n  uncertainties:\n  - Replacement license costs unknown\n  nextInvestigation: Investigate maintained replacements.\n  severity: high\n  impact: adverse\n  supersedes: []\nrisks:\n- id: R-WRAPPERS\n  description: Unmaintained wrappers may require custom replacement and increase effort.\n  likelihood: medium\n  impact: high\n  evidenceRefs:\n  - E-DEPS\n  mitigationOptions:\n  - Evaluate maintained alternatives\n  - Isolate through an adapter boundary\n  status: open\n  owner: Integration research lead\nquestions:\n- id: Q-SERIAL\n  dimensionId: D-COMPAT\n  question: Will legacy session fixtures deserialize safely?\n  status: open\n  owner: Runtime research lead\n  nextStep: Run a negative and positive fixture matrix.\n  blocking: true\n  evidenceRefs:\n  - E-ASSUME\n- id: Q-LEGAL\n  dimensionId: D-DEPS\n  question: Are candidate replacement licenses acceptable?\n  status: open\n  owner: Legal liaison\n  nextStep: Request a documented license position.\n  blocking: true\n  evidenceRefs:\n  - E-DEPS\n- id: Q-ROI\n  dimensionId: D-ECON\n  question: What counterfactual cost and benefit horizon should management use?\n  status: open\n  owner: Finance partner\n  nextStep: Validate avoided-cost assumptions.\n  blocking: true\n  evidenceRefs: []\n```\n","hash":"90f89252abc6b201fdf5cb158bdd4d6d1b1b94744af1303238b5a68ea199b193"},"03-economics-and-decisions.md":{"content":"# Economic analysis • alternatives, ranges and decision gates\n\n\u003e SYNTHETIC CASE STUDY — not vendor guidance or production measurements.\n\n## Estimation method\nThe sample estimate is an order-of-magnitude research output, not a delivery commitment. A low scenario assumes two reusable adapters; a high scenario assumes replacing three wrappers and retesting transaction behavior.\n\n| Item | Low | High | Unit | Confidence |\n| --- | ---: | ---: | --- | --- |\n| Technical adaptation effort | 60 | 100 | person-days | Low |\n| One-time external cost | 35000 | 65000 | USD | Low |\n| Recurring benefit | Unknown | Unknown | USD/year | Unknown |\n\n## Worthiness and sensitivity\nNo ROI is calculated: the benefit baseline and evaluation horizon are missing. Person-days are not added to dollars. The effort range excludes license renegotiation, enterprise rollout, parallel-run costs and contingency for operational recovery.\n\n## Alternatives\nRetain: avoids near-term change but leaves support exposure unquantified.\nStaged modernization: offers a bounded experiment, with integration uncertainty.\nReplace: might simplify the estate, but business-function parity is unassessed.\n\n## Management ask\nApprove two further assessment experiments and a finance workshop. Do not treat research funding as implementation authorization.\n\n```assessment\nevidence:\n- id: E-MODEL\n  description: Synthetic effort scenario model with explicitly incomplete benefits.\n  kind: financial-model\n  verificationStatus: reviewed\n  capturedAt: '2026-11-02'\n  reviewedBy: Analysis lead\n  limitations: No calibrated productivity baseline, benefit horizon or operating-cost\n    counterfactual.\n  sourceRefs:\n  - path: '@self'\n    startLine: 5\n    endLine: 23\nestimates:\n- id: EST-EFFORT\n  title: Technical adaptation effort\n  category: effort\n  low: 60\n  high: 100\n  unit: person-days\n  confidence: low\n  assumptions:\n  - Two reusable adapters in the low case\n  - Three wrapper replacements in the high case\n  - Excludes rollout and recovery\n  evidenceRefs:\n  - E-MODEL\n- id: EST-COST\n  title: One-time external assessment of transition costs\n  category: cost\n  low: 35000\n  high: 65000\n  unit: USD\n  confidence: low\n  assumptions:\n  - Synthetic quotes\n  - Licensing renegotiation excluded\n  evidenceRefs:\n  - E-MODEL\n- id: EST-BENEFIT\n  title: Recurring economic benefit\n  category: benefit\n  low: null\n  high: null\n  unit: USD/year\n  confidence: unknown\n  assumptions:\n  - Benefit horizon and counterfactual not yet agreed\n  evidenceRefs: []\nalternatives:\n- id: ALT-RETAIN\n  description: Retain the current platform\n  benefits:\n  - No immediate conversion expenditure\n  drawbacks:\n  - Unquantified support and opportunity costs\n  effortEstimate: Unknown; support stabilization not estimated\n  assumptions:\n  - Current support remains purchasable\n  evidenceRefs:\n  - E-MODEL\n  verdict: viable\n- id: ALT-STAGED\n  description: Assess a staged modernization\n  benefits:\n  - Limits exposure while testing critical hypotheses\n  drawbacks:\n  - Parallel-platform overhead remains unknown\n  effortEstimate: See EST-EFFORT; not a delivery commitment\n  assumptions:\n  - Representative slices predict key compatibility risks\n  evidenceRefs:\n  - E-SCAN\n  - E-MODEL\n  verdict: preferred\n- id: ALT-REPLACE\n  description: Replace with a new service implementation\n  benefits:\n  - Potential simplification\n  drawbacks:\n  - Functional parity and data migration unassessed\n  effortEstimate: Not yet measurable\n  assumptions:\n  - Business processes can be re-specified\n  evidenceRefs: []\n  verdict: unassessed\ngates:\n- id: G-COMPAT\n  title: Representative compatibility evidence\n  status: unmet\n  critical: true\n  rationale: Runtime and serialization experiments missing.\n  evidenceRefs:\n  - E-SCAN\n- id: G-DEPS\n  title: Maintained dependency path demonstrated\n  status: unknown\n  critical: false\n  rationale: Candidate replacements not yet tested.\n  evidenceRefs:\n  - E-DEPS\n- id: G-ECON\n  title: Defensible worthiness model\n  status: unknown\n  critical: true\n  rationale: Benefit model and counterfactual missing.\n  evidenceRefs:\n  - E-MODEL\n- id: G-OPS\n  title: Operational recovery assessment\n  status: unknown\n  critical: true\n  rationale: No recovery investigation completed.\n  evidenceRefs: []\ndecisions:\n- id: DEC-EXPERIMENT\n  title: Authorize two assessment experiments\n  status: proposed\n  owner: Architecture sponsor\n  dueOn: '2026-11-06'\n  rationale: Resolve the most material compatibility uncertainties before a migration\n    decision.\n  evidenceRefs:\n  - E-SCAN\nactivities:\n- id: ACT-RESEARCH\n  title: Serialization and transaction research experiments\n  status: planned\n  owner: Research agents + reviewer\n  nextStep: Use synthetic fixtures and preserve raw observations.\n  evidenceRefs:\n  - E-ASSUME\n```\n","hash":"d4ebea1d341c46b82d7406d7ca3b7ac0ca0d71a13ab79f0f1e5daf4fafcf92e9"},"04-runtime-validation.md":{"content":"# Week 2 • runtime experiments change the conclusion\n\n\u003e SYNTHETIC CASE STUDY — not vendor guidance or production measurements.\n\n## Reproducible experimental design\nSynthetic run ID LAB-ATLAS-2026-11-09-A used 32 session fixtures and 18 transaction cases on an isolated candidate stack. The control used the legacy serialization descriptors. Results were reviewed by a second analyst; all numbers are fictional test inputs.\n\n| Experiment | Passed | Failed | Consequence |\n| --- | ---: | ---: | --- |\n| Legacy session deserialization without adapter | 23 | 9 | Namespace-only hypothesis contradicted |\n| Session deserialization with explicit version adapter | 32 | 0 | Candidate mitigation demonstrated on sample |\n| Representative transaction rollback | 18 | 0 | Bounded transaction path validated |\n\n## Revised interpretation\nThe prior F-SERIAL conclusion is contradicted by nine failing fixtures. It remains in the record and in the earlier snapshot. New finding F-ADAPTER supersedes it for planning: explicit serialization version adaptation is necessary. Passing sampled fixtures does not establish full production behavior.\n\n## Residual uncertainties\n- Distributed recovery and restart behavior are still outside this experiment.\n- Capacity and long-lived session diversity are unassessed.\n- A namespace scan cannot demonstrate semantic equivalence.\n\n## Next research\nPrioritize a restore-and-replay experiment, including partial transaction failure and aged session fixtures.\n\n```assessment\ninvestigations:\n- id: I-API\n  dimensionId: D-COMPAT\n  question: Are API and namespace adaptations bounded?\n  status: validated\n  owner: Research team\n  scopeWeight: 2\n  nextStep: Validate a representative transaction slice.\n- id: I-SERIAL\n  dimensionId: D-COMPAT\n  question: Can stored serialized sessions be read?\n  status: corroborated\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Capture legacy session fixtures.\n- id: I-DEPS\n  dimensionId: D-DEPS\n  question: Do maintained replacement libraries exist?\n  status: corroborated\n  owner: Research team\n  scopeWeight: 2\n  nextStep: Reconcile the full transitive inventory.\n- id: I-LICENSE\n  dimensionId: D-DEPS\n  question: Are replacement licenses acceptable?\n  status: preliminary\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Request legal review of candidate licenses.\n- id: I-RUNTIME\n  dimensionId: D-PLATFORM\n  question: Does the target runtime host representative workloads?\n  status: preliminary\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Run a transaction and recovery experiment.\n- id: I-AUTH\n  dimensionId: D-SEC\n  question: Are authorization semantics equivalent?\n  status: preliminary\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Exercise denied and cross-tenant requests.\n- id: I-SUPPORT\n  dimensionId: D-SEC\n  question: Is the support lifecycle adequate?\n  status: inconclusive\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Obtain written support assumptions.\n- id: I-ROI\n  dimensionId: D-ECON\n  question: Are benefits and avoided costs worth the effort?\n  status: investigating\n  owner: Research team\n  scopeWeight: 2\n  nextStep: Validate the counterfactual and benefit horizon.\n- id: I-RECOVERY\n  dimensionId: D-OPS\n  question: Can operations sustain the candidate platform?\n  status: investigating\n  owner: Research team\n  scopeWeight: 1\n  nextStep: Interview operations and test restore assumptions.\nevidence:\n- id: E-TX\n  description: 'Synthetic transaction rollback experiment: 18/18 passed on a representative\n    slice.'\n  kind: experiment\n  verificationStatus: validated\n  capturedAt: '2026-11-09'\n  reviewedBy: Independent reviewer\n  limitations: Sampled cases only; distributed recovery excluded.\n  sourceRefs:\n  - path: '@self'\n    startLine: 5\n    endLine: 23\n- id: E-SERIAL\n  description: 'Synthetic legacy fixture experiment: 9/32 fail without adapter; 32/32\n    pass with adapter.'\n  kind: experiment\n  verificationStatus: validated\n  capturedAt: '2026-11-09'\n  reviewedBy: Independent reviewer\n  limitations: Synthetic fixture set; production diversity unmeasured.\n  sourceRefs:\n  - path: '@self'\n    startLine: 5\n    endLine: 23\nfindings:\n- id: F-API\n  investigationId: I-API\n  title: Representative API adaptation validated\n  conclusion: The representative transaction slice passes all 18 rollback cases with\n    the adapter layer.\n  status: validated\n  confidence: high\n  evidenceRefs:\n  - E-TX\n  implications: This informs feasibility and estimated research needs; it is not implementation\n    completion.\n  uncertainties:\n  - Distributed recovery excluded\n  nextInvestigation: Test failure recovery under restart.\n  severity: high\n  impact: favorable\n  supersedes: []\n- id: F-SERIAL\n  investigationId: I-SERIAL\n  title: Namespace-only session hypothesis contradicted\n  conclusion: Nine of 32 synthetic legacy fixtures fail without an explicit serialization\n    adapter. The prior assumption is contradicted.\n  status: contradicted\n  confidence: low\n  evidenceRefs:\n  - E-SERIAL\n  implications: This informs feasibility and estimated research needs; it is not implementation\n    completion.\n  uncertainties:\n  - Legacy session diversity unknown\n  nextInvestigation: Use F-ADAPTER for subsequent evaluation.\n  severity: critical\n  impact: adverse\n  supersedes: []\n- id: F-ADAPTER\n  investigationId: I-SERIAL\n  title: Explicit session adapter required\n  conclusion: An explicit serialization version adapter is required; it passes all\n    sampled fixtures.\n  status: corroborated\n  confidence: medium\n  evidenceRefs:\n  - E-SERIAL\n  implications: This informs feasibility and estimated research needs; it is not implementation\n    completion.\n  uncertainties:\n  - Production fixture diversity unmeasured\n  nextInvestigation: Expand fixture diversity before accepting broad compatibility.\n  severity: critical\n  impact: mixed\n  supersedes:\n  - F-SERIAL\nquestions:\n- id: Q-SERIAL\n  dimensionId: D-COMPAT\n  question: Will legacy session fixtures deserialize safely?\n  status: answered\n  owner: Runtime research lead\n  nextStep: Expand production-representative fixture diversity.\n  blocking: true\n  evidenceRefs:\n  - E-SERIAL\nrisks:\n- id: R-SESSION\n  description: Stored session incompatibility raises adaptation effort and backward-compatibility\n    uncertainty.\n  likelihood: high\n  impact: critical\n  evidenceRefs:\n  - E-SERIAL\n  mitigationOptions:\n  - Explicit version adapters\n  - Investigate session invalidation trade-offs\n  status: open\n  owner: Runtime research lead\ngates:\n- id: G-COMPAT\n  title: Representative compatibility evidence\n  status: met\n  critical: true\n  rationale: Sampled API and serialization behavior is evidenced; this gate is limited\n    to representative evidence.\n  evidenceRefs:\n  - E-TX\n  - E-SERIAL\nactivities:\n- id: ACT-RESEARCH\n  title: Serialization and transaction research experiments\n  status: completed\n  owner: Research agents + reviewer\n  nextStep: Investigate operational recovery and broaden fixtures.\n  evidenceRefs:\n  - E-TX\n  - E-SERIAL\n```\n","hash":"4836c587a0824ecc17a347f223e3f609fc084dcc121f138f2d97a03c3f6e9ee3"},"05-dependency-and-security-review.md":{"content":"# Week 2 • dependencies, licensing and security unknowns\n\n\u003e SYNTHETIC CASE STUDY — not vendor guidance or production measurements.\n\n## Dependency reconciliation\nThe fictional inventory now reconciles all 187 direct dependencies. Two maintained replacement candidates pass interface smoke checks; one wrapper still needs an isolation experiment. A license exception has been requested but not approved.\n\n## Security investigation\nA negative-case walkthrough exposes two ambiguous authorization paths. Without an approved policy oracle these results are inconclusive. The support-policy investigation could not reconcile conflicting draft vendor terms, so it is explicitly inconclusive rather than favorable evidence.\n\n## Cross-agent interpretation\nThe inventory agent and security agent worked on separate records. Review retained original evidence IDs and added new evidence rather than relabeling old assumptions as validated.\n\n## Open research\nObtain authoritative license and support terms. Validate denied, cross-tenant and delegated-access cases. Test the third wrapper in isolation.\n\n```assessment\nevidence:\n- id: E-DEPS2\n  description: Complete synthetic direct inventory with two interface smoke checks.\n  kind: analysis\n  verificationStatus: reviewed\n  capturedAt: '2026-11-09'\n  reviewedBy: Analysis lead\n  limitations: License exception unresolved; third wrapper experiment pending.\n  sourceRefs:\n  - path: '@self'\n    startLine: 5\n    endLine: 15\nfindings:\n- id: F-DEPS\n  investigationId: I-DEPS\n  title: Dependency path partially corroborated\n  conclusion: Two maintained replacement candidates pass smoke checks; one wrapper\n    and license exception remain unresolved.\n  status: corroborated\n  confidence: medium\n  evidenceRefs:\n  - E-DEPS\n  - E-DEPS2\n  implications: This informs feasibility and estimated research needs; it is not implementation\n    completion.\n  uncertainties:\n  - License exception not approved\n  - Third wrapper untested\n  nextInvestigation: Resolve license and isolation questions.\n  severity: high\n  impact: mixed\n  supersedes: []\ngates:\n- id: G-DEPS\n  title: Maintained dependency path demonstrated\n  status: met\n  critical: false\n  rationale: A representative maintained replacement path is documented; complete\n    legal clearance is tracked separately.\n  evidenceRefs:\n  - E-DEPS2\nquestions:\n- id: Q-SUPPORT\n  dimensionId: D-SEC\n  question: Which support terms and security policy oracle are authoritative?\n  status: open\n  owner: Security \u0026 procurement\n  nextStep: Obtain written terms and an approved deny-policy oracle.\n  blocking: true\n  evidenceRefs:\n  - E-DEPS2\n```\n","hash":"fa36424386f9d6d082e9c380ab5db9f61feb31ca0c2d1ba499759061c32228d9"},"06-worthiness-reassessment.md":{"content":"# Week 2 • revised effort and pending business case\n\n\u003e SYNTHETIC CASE STUDY — not vendor guidance or production measurements.\n\n## Revised effort model\nThe session adapter introduces an additional effort driver. The synthetic technical adaptation range increases from 60–100 to 95–155 person-days. This is a model revision, not implementation slippage. The external-cost range stays unchanged because procurement has supplied no updated quote.\n\n## What remains unknown\nFinance cannot yet validate an avoided-support-cost counterfactual or benefit horizon. Recurring benefits remain unknown. A high research-coverage score would not close this gap.\n\n## Current worthiness view\nDefer the migration commitment while authorizing the next assessment slice. The staged option remains the leading research candidate, not an approved migration plan. Recovery assessment and a defensible economic model are mandatory decision gates.\n\n## Next management conversation\nAgree the counterfactual, sponsor the recovery experiment, and obtain a license position. Research funding is approved; migration implementation is not.\n\n```assessment\nexecutiveSummary:\n- 'The week changed our understanding: namespace-only session compatibility was contradicted;\n  an explicit adapter is now evidenced on synthetic fixtures.'\n- Representative transaction evidence strengthened, and dependency alternatives partially\n  matured. Technical adaptation effort rises to 95–155 person-days.\n- 'Defer migration commitment: benefits remain unknown and operational recovery is\n  insufficiently assessed. Next priorities are the economic counterfactual, recovery\n  experiment and license position.'\nevidence:\n- id: E-MODEL2\n  description: Revised synthetic effort model incorporating session adapter work.\n  kind: financial-model\n  verificationStatus: reviewed\n  capturedAt: '2026-11-09'\n  reviewedBy: Analysis lead\n  limitations: Benefits, recovery and rollout remain uncalibrated; estimates are not\n    commitments.\n  sourceRefs:\n  - path: '@self'\n    startLine: 5\n    endLine: 15\nestimates:\n- id: EST-EFFORT\n  title: Technical adaptation effort\n  category: effort\n  low: 95\n  high: 155\n  unit: person-days\n  confidence: medium\n  assumptions:\n  - Explicit serialization adapter now required\n  - Includes wrapper isolation uncertainty\n  - Excludes rollout and unassessed recovery effort\n  evidenceRefs:\n  - E-MODEL2\n  - E-SERIAL\nrecommendations:\n- id: REC-ATLAS\n  conclusion: Defer migration commitment; continue focused assessment.\n  rationale: Technical feasibility is increasingly evidenced, but worthiness is not\n    established without the economic counterfactual and recovery assessment.\n  supportingFindings:\n  - F-API\n  - F-ADAPTER\n  - F-DEPS\n  limitations:\n  - Unknown benefits\n  - No recovery evidence\n  - License exception unresolved\n  decisionStatus: recommended\n  stance: defer\ngates:\n- id: G-OPS\n  title: Operational recovery assessment\n  status: unmet\n  critical: true\n  rationale: Investigation started, but no restore/replay evidence is available.\n  evidenceRefs: []\ndecisions:\n- id: DEC-EXPERIMENT\n  title: Authorize two assessment experiments\n  status: approved\n  owner: Architecture sponsor\n  dueOn: '2026-11-06'\n  rationale: Assessment experiment funding approved. This does not approve migration\n    execution.\n  evidenceRefs:\n  - E-TX\n  - E-SERIAL\n- id: DEC-COUNTERFACTUAL\n  title: Agree an economic counterfactual and horizon\n  status: proposed\n  owner: Finance sponsor\n  dueOn: '2026-11-16'\n  rationale: Worthiness cannot be evaluated without a baseline and horizon.\n  evidenceRefs:\n  - E-MODEL2\n```\n","hash":"d0f46f3e79fa31fe4ee5194d66b7f4e3ca71dbcad6649bc4696080cecf27c3c0"}},"uiVersion":"1.0"}}],"templateHashes":{"app.js":"a6c11a8b27c67486cf1d5da7a7a76e16e89fa1067cd6ca86da778dceeb6598ca","shell.html":"7cbeefa8abfb0232f15a060ca8d6f7199b700bf1561a6c4045fa6e0ba9818e6e","theme.css":"b763624feb7b26effcea5c3090e6f17bf0253b443bf53bb2c6545775cad87481"},"uiVersion":"1.0"}</script>
<script>
(() => {
'use strict';
const data=JSON.parse(document.getElementById('assessment-data').textContent);
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const values=o=>Object.values(o||{});
const titles=[['overview','Executive Overview'],['coverage','Assessment Coverage'],['findings','Findings & Evidence'],['risks','Risks & Unknowns'],['alternatives','Alternatives & Trade-offs'],['economics','Effort, Cost & Benefit'],['evolution','Weekly Evolution'],['readiness','Decision Readiness'],['appendix','Technical Appendix']];
let selected=data.snapshots.length-1,section=location.pathname.endsWith('weekly-delta.html')?'evolution':'overview',baseline=Math.max(0,selected-1);
const fixedPeriod=$('assessment-app').dataset.period;
if(fixedPeriod){selected=data.snapshots.findIndex(x=>x.reportingPeriod===fixedPeriod);baseline=Math.max(0,selected-1);}
if(titles.some(([id])=>id===location.hash.slice(1)))section=location.hash.slice(1);
let s,m,snap;
function badge(text){const good=['validated','met','approved','answered','completed','strengthened','resolved','preferred'];const warn=['preliminary','investigating','unverified','pending','unknown','proposed','inconclusive','defer'];const bad=['contradicted','critical','unmet','weakened','rejected','high'];const type=good.includes(text)?'good':bad.includes(text)?'bad':warn.includes(text)?'warn':'info';return `<span class="badge ${type}">${esc(text)}</span>`;}
const list=xs=>xs?.length?`<ul class="summary-list">${xs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="fine">None recorded.</p>';
function evidence(ids){return ids?.length?ids.map(id=>`<button class="evidence-link" data-evidence="${esc(id)}">↗ ${esc(id)} · ${esc(s.evidence[id]?.verificationStatus||'unknown')}</button>`).join(''):'<span class="badge warn">Unverified · no supporting evidence</span>';}
function sourceLink(c,r){return `<button class="row-link" data-record="${esc(c)}:${esc(r.id)}">Source & revision ${r.revision}</button>`;}
function card(title,content,extra=''){return `<article class="card searchable ${extra}"><h3>${esc(title)}</h3>${content}</article>`;}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr class="searchable">${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="empty">No records in this report.</td></tr>`}</tbody></table></div>`;}
function pct(n){return n===null?'Unknown':`${n}%`;}
function track(n){return `<div class="track" role="meter" aria-label="Analysis coverage" aria-valuemin="0" aria-valuemax="100" ${n===null?'':`aria-valuenow="${n}"`}><i style="width:${n??0}%"></i></div>`;}
function kpi(label,value,note,ratio){return `<div class="kpi"><div class="kpi-label">${esc(label)}</div><div class="kpi-value">${value}</div>${ratio!==undefined?`<div class="mini-track"><i style="width:${ratio??0}%"></i></div>`:''}<small>${esc(note)}</small></div>`;}
function dimensions(){return m.dimensions.map(d=>`<div class="dimension-row searchable"><div class="dimension-label"><span>${esc(d.title)}</span><span>${pct(d.coverage)}</span></div>${track(d.coverage)}<small>Examined scope ${d.examined} / ${d.planned} · dimension weight ${d.weight}</small></div>`).join('');}
function overview(){const rec=s.recommendations[s.program.currentRecommendationId];const recent=snap.changes.filter(c=>['findings','recommendations','estimates'].includes(c.collection)).slice(0,4);return `<div class="kpis">${kpi('Analysis coverage',pct(m.coverage),'Examined share of planned research scope',m.coverage)}${kpi('Evidence validated',`${m.evidenceValidated}<span> / ${m.evidenceTotal}</span>`,'Validated evidence / all evidence',m.evidencePct)}${kpi('Open uncertainties',m.openQuestions,'Unanswered research questions')}${kpi('Decision gates',`${m.gatesMet}<span> / ${m.gatesTotal}</span>`,'Met gates; critical unknowns still block',m.readinessPct)}</div><div class="two-col"><article class="card recommendation searchable"><div class="card-head"><h3>Current assessment</h3>${badge(rec.stance)}</div><div class="rec-title">${esc(rec.conclusion)}</div><p class="rec-copy">${esc(rec.rationale)}</p><div class="tag-row">${badge(rec.decisionStatus)}<span class="badge">${m.blockingGates.length} critical gates outstanding</span></div>${list(rec.limitations)}<div>${rec.supportingFindings.map(id=>`<button class="evidence-link" data-finding="${esc(id)}">↗ ${esc(id)}</button>`).join('')}</div>${sourceLink('recommendations',rec)}</article><article class="card"><div class="card-head"><h3>What management needs to know</h3><span class="small-label">CURRENT SYNTHESIS</span></div>${list(s.executiveSummary)}<div class="callout">Research coverage describes what has been examined. It does not measure confidence, feasibility, or migration completion.</div></article></div><div class="two-col"><article class="card"><div class="card-head"><h3>Assessment dimensions</h3><button class="row-link" data-view="coverage">View research scope →</button></div>${dimensions()}</article><article class="card"><div class="card-head"><h3>What changed our understanding</h3><button class="row-link" data-view="evolution">Explore changes →</button></div>${recent.map(c=>`<div class="history-item searchable"><div><span class="id">${esc(c.id)}</span><p style="font-size:12px">${esc(c.title)}</p></div>${badge(c.kind)}</div>`).join('')||'<p class="fine">No prior period changes.</p>'}<div class="callout warn">${m.blockingGates.length?`${m.blockingGates.length} critical gates require further evidence before a proceed recommendation.`:'All critical gates met. A management decision is still explicit.'}</div></article></div>`;}
function coverage(){return `<div class="two-col"><div class="card"><h3>Planned scope & examined coverage</h3>${dimensions()}</div><div class="card"><h3>How these measures are calculated</h3><p class="fine">Coverage uses planned investigation scope weights within each dimension, then business-defined dimension weights. Preliminary or later outcomes count as examined; started work does not.</p><p class="fine">Validated evidence: ${m.evidenceValidated}/${m.evidenceTotal}. Corroborated or validated findings: ${m.corroboratedFindings}/${m.findingsTotal}. Rejected evidence and assumptions remain in the denominator.</p><p class="fine">No planned investigation scope means Unknown, not zero confidence or favorable evidence. An inconclusive outcome increases examined coverage while leaving uncertainty explicit.</p></div></div><div class="card"><h3>Investigation register</h3>${table(['Investigation / question','Dimension','Lifecycle','Owner / next inquiry','Provenance'],values(s.investigations).map(i=>[`<span class="id">${esc(i.id)}</span><strong>${esc(i.question)}</strong>`,`<span>${esc(s.dimensions[i.dimensionId]?.title)}</span><p>Scope weight ${i.scopeWeight}</p>`,badge(i.status),`${esc(i.owner)}<p>${esc(i.nextStep)}</p>`,sourceLink('investigations',i)]))}</div>`;}
function findingCard(f){return `<article class="card finding searchable" data-finding-id="${esc(f.id)}" data-status="${esc(f.status)}"><div class="card-head"><span class="id">${esc(f.id)} · revision ${f.revision}</span>${badge(f.status)}</div><h3 class="finding-title">${esc(f.title)}</h3><p>${esc(f.conclusion)}</p><div class="tag-row">${badge(f.confidence)} confidence ${badge(f.impact)} ${badge(f.severity)}</div><p class="fine">${esc(f.implications)}</p><div class="finding-meta"><div><span class="small-label">UNCERTAINTIES</span>${list(f.uncertainties)}</div></div><p class="fine"><strong>Next:</strong> ${esc(f.nextInvestigation)}</p>${f.supersedes.length?`<p class="fine">Supersedes ${f.supersedes.map(esc).join(', ')}. Earlier conclusions remain in history.</p>`:''}<div>${evidence(f.evidenceRefs)}</div>${sourceLink('findings',f)}</article>`;}
function findings(){return `<div class="filter-bar"><label for="finding-filter">Finding maturity</label><select id="finding-filter"><option value="all">All findings</option>${['preliminary','corroborated','validated','inconclusive','contradicted','superseded'].map(x=>`<option>${x}</option>`).join('')}</select><span class="fine">Confidence is an analyst assertion; verification is shown separately.</span></div><div class="findings-grid">${values(s.findings).map(findingCard).join('')}</div><div class="card" style="margin-top:20px"><h3>Evidence register</h3>${table(['Evidence','Verification','Kind / limitations','Trace'],values(s.evidence).map(e=>[`<span class="id">${esc(e.id)}</span>${esc(e.description)}`,badge(e.verificationStatus),`${badge(e.kind)}<p>${esc(e.limitations)}</p>`,evidence([e.id])]))}</div>`;}
function risks(){return `<div class="card"><h3>Potential risks and compatibility concerns</h3>${table(['Risk','Likelihood / impact','Status / owner','Possible mitigation','Evidence'],values(s.risks).map(r=>[`<span class="id">${esc(r.id)}</span><strong>${esc(r.description)}</strong>`,`${badge(r.likelihood)} likelihood<br>${badge(r.impact)} impact`,`${badge(r.status)}<p>${esc(r.owner)}</p>`,list(r.mitigationOptions),evidence(r.evidenceRefs)+sourceLink('risks',r)]))}</div><div class="card"><h3>Uncertainties & unanswered questions</h3>${table(['Question','Status','Owner / next investigation','Trace'],values(s.questions).map(q=>[`<span class="id">${esc(q.id)}</span><strong>${esc(q.question)}</strong><p>${q.blocking?'Decision-blocking question':'Non-blocking question'}</p>`,badge(q.status),`${esc(q.owner)}<p>${esc(q.nextStep)}</p>`,evidence(q.evidenceRefs)+sourceLink('questions',q)]))}</div>`;}
function alternatives(){return `<div class="callout">The preferred research alternative is not authorization to execute a migration. Unknown effort and unverified benefits stay explicit.</div><div class="card">${table(['Alternative','Potential benefits','Drawbacks / assumptions','Effort / assessment','Evidence'],values(s.alternatives).map(a=>[`<span class="id">${esc(a.id)}</span><strong>${esc(a.description)}</strong>`,list(a.benefits),list(a.drawbacks)+`<p>Assumptions: ${esc(a.assumptions.join('; '))}</p>`,`${badge(a.verdict)}<p>${esc(a.effortEstimate)}</p>`,evidence(a.evidenceRefs)+sourceLink('alternatives',a)]))}</div>`;}
function economics(){return `<div class="callout warn">Estimates are ranges with stated assumptions, not commitments. No ROI or combined total is calculated while benefits, horizons, or compatible units are missing.</div><div class="card"><h3>Evidence-backed estimates</h3>${table(['Estimate','Range','Confidence','Assumptions / exclusions','Evidence'],values(s.estimates).map(e=>[`<span class="id">${esc(e.id)} · ${esc(e.category)}</span><strong>${esc(e.title)}</strong>`,e.low===null?'<strong>Not yet measurable</strong>':`<strong>${e.low.toLocaleString('en-US')}–${e.high.toLocaleString('en-US')}</strong><p>${esc(e.unit)}</p>`,badge(e.confidence),list(e.assumptions),evidence(e.evidenceRefs)+sourceLink('estimates',e)]))}</div><div class="card"><h3>What the economics currently establish</h3><p class="fine">${esc(s.recommendations[s.program.currentRecommendationId].rationale)}</p>${list(s.recommendations[s.program.currentRecommendationId].limitations)}</div>`;}
function compare(a,b){let changes=[];const collections=['dimensions','investigations','findings','evidence','risks','questions','alternatives','estimates','gates','decisions','recommendations','activities'];const rank={unknown:0,low:1,medium:2,high:3};for(const c of collections){for(const id of [...new Set([...Object.keys(a[c]||{}),...Object.keys(b[c]||{})])].sort()){const x=a[c]?.[id],y=b[c]?.[id];if(JSON.stringify(x)===JSON.stringify(y))continue;let fields=[];if(x&&y){for(const key of [...new Set([...Object.keys(x),...Object.keys(y)])].sort()){if(!(c==='evidence'?['updatedAt','revision']:['updatedAt','revision','sourceRefs']).includes(key)&&JSON.stringify(x[key])!==JSON.stringify(y[key]))fields.push({field:key,before:x[key],after:y[key]});}if(!fields.length)continue;}let kind=!x?'added':!y?'removed':'revised';if(c==='findings'&&x&&y){if(['contradicted','superseded'].includes(y.status)&&x.status!==y.status)kind=y.status;else if(rank[y.confidence]>rank[x.confidence])kind='strengthened';else if(rank[y.confidence]<rank[x.confidence])kind='weakened';}if(c==='questions'&&x&&y&&x.status==='open'&&y.status==='answered')kind='resolved';const r=y||x;changes.push({collection:c,id,kind,title:r.title||r.question||r.description||r.conclusion||id,fields,beforeRevision:x?.revision,afterRevision:y?.revision});}}if(JSON.stringify(a.executiveSummary)!==JSON.stringify(b.executiveSummary))changes.push({collection:'executiveSummary',id:'summary',kind:'revised',title:'Executive synthesis updated',fields:[{field:'executiveSummary',before:a.executiveSummary,after:b.executiveSummary}]});return changes;}
function evolution(){const base=selected===0?null:data.snapshots[baseline];const changes=base?compare(base.state,s):snap.changes;return `<div class="filter-bar"><label for="baseline-select">Compare against</label><select id="baseline-select">${selected===0?'<option>No earlier snapshot</option>':data.snapshots.slice(0,selected).map((x,i)=>`<option value="${i}" ${i===baseline?'selected':''}>${esc(x.reportingPeriod)} · ${esc(x.state.asOf)}</option>`).join('')}</select><span class="fine">${base?esc(base.reportingPeriod)+' → '+esc(snap.reportingPeriod):'Initial assessment baseline'}</span></div><div class="stat-line"><span><strong>${changes.length}</strong> record-level changes</span><span><strong>${changes.filter(c=>c.kind==='contradicted').length}</strong> contradicted conclusions</span><span><strong>${changes.filter(c=>c.kind==='strengthened').length}</strong> strengthened findings</span></div>${changes.map(c=>`<article class="card delta ${esc(c.kind)} searchable"><div class="card-head"><span class="id">${esc(c.collection)} / ${esc(c.id)} · revision ${c.beforeRevision??'—'} → ${c.afterRevision??'—'}</span>${badge(c.kind)}</div><h3>${esc(c.title)}</h3>${c.fields.length?`<details ${c.collection==='findings'?'open':''}><summary>${c.fields.length} changed fields · inspect previous and current understanding</summary>${c.fields.map(f=>`<div class="delta-field"><div class="before"><strong>Before · ${esc(f.field)}</strong>${esc(typeof f.before==='object'?JSON.stringify(f.before):f.before)}</div><div><strong>Now · ${esc(f.field)}</strong>${esc(typeof f.after==='object'?JSON.stringify(f.after):f.after)}</div></div>`).join('')}</details>`:'<p class="fine">New record. Its complete content is included in the cumulative report.</p>'}${c.collection==='findings'&&s.findings[c.id]?`<button class="row-link" data-finding="${esc(c.id)}">Inspect finding and evidence →</button>`:''}</article>`).join('')||'<div class="card empty">No record changes.</div>'}`;}
function readiness(){const rec=s.recommendations[s.program.currentRecommendationId];return `<div class="two-col"><article class="card"><h3>Decision evidence gates</h3><p class="fine">${m.gatesMet}/${m.gatesTotal} met (${pct(m.readinessPct)}). Critical gates are binding; readiness is not an approval score.</p>${values(s.gates).map(g=>`<div class="gate searchable"><span class="gate-dot ${esc(g.status)}">${g.status==='met'?'✓':g.status==='unknown'?'?':'!'}</span><div><span class="id">${esc(g.id)} · ${g.critical?'CRITICAL':'ADVISORY'}</span><strong>${esc(g.title)}</strong> ${badge(g.status)}<p>${esc(g.rationale)}</p>${evidence(g.evidenceRefs)}${sourceLink('gates',g)}</div></div>`).join('')}</article><article class="card recommendation"><h3>Recommendation & limitations</h3><div class="rec-title">${esc(rec.conclusion)}</div><p class="rec-copy">${esc(rec.rationale)}</p>${list(rec.limitations)}${rec.supportingFindings.map(id=>`<button class="evidence-link" data-finding="${esc(id)}">↗ ${esc(id)}</button>`).join('')}<div class="callout">Recommendation status: ${esc(rec.decisionStatus)}. Report approval records the reviewed assessment; it does not approve migration execution.</div></article></div><div class="card"><h3>Outstanding management decisions</h3>${table(['Decision','Status','Owner / due','Rationale / provenance'],values(s.decisions).map(d=>[`<span class="id">${esc(d.id)}</span><strong>${esc(d.title)}</strong>`,badge(d.status),`${esc(d.owner)}<p>${esc(d.dueOn)}</p>`,`${esc(d.rationale)}<p>${evidence(d.evidenceRefs)}</p>${sourceLink('decisions',d)}`]))}</div><div class="card"><h3>Next assessment activities</h3>${table(['Research activity','Status','Owner / next action'],values(s.activities).map(a=>[`<span class="id">${esc(a.id)}</span>${esc(a.title)}`,badge(a.status),`${esc(a.owner)}<p>${esc(a.nextStep)}</p>${evidence(a.evidenceRefs)}`]))}</div>`;}
function appendix(){return `<div class="two-col"><div class="card"><h3>Approved reporting history</h3>${data.snapshots.map((x,i)=>`<div class="history-item searchable"><div><strong>${esc(x.reportingPeriod)}</strong><p class="fine">${esc(x.state.asOf)} · ${esc(x.reviewer)}<br><code>${esc(x.hash.slice(0,20))}…</code></p></div><button class="row-link" data-snapshot="${i}">${i===selected?'Selected':'Open report →'}</button></div>`).join('')}</div><div class="card"><h3>Publication & provenance contract</h3><dl class="field-list"><dt>Schema / presentation</dt><dd>${esc(s.schemaVersion)} / ${esc(s.uiVersion)}</dd><dt>Reviewed by</dt><dd>${esc(snap.reviewer)}</dd><dt>Approval timestamp</dt><dd>${esc(snap.createdAt)}</dd><dt>Last update actor</dt><dd>${esc(snap.provenance.actor)}</dd><dt>Update method</dt><dd>${esc(snap.provenance.operation)}</dd></dl><div class="callout">The HTML is generated by Quarto from schema-validated content and fixed components. No LLM executes during ingestion or rendering.</div><p class="fine">Historical comparisons are computed using stable IDs. “Strengthened” and “weakened” reflect explicit confidence changes; a text-only conclusion change is “revised.”</p></div></div><div class="card"><h3>Original source material</h3>${table(['Source','Integrity','Access'],Object.entries(s.sources).map(([path,src])=>[`<strong>${esc(path)}</strong><p>${src.content.split('\n').length} lines · original Markdown retained</p>`,`<code>${esc(src.hash.slice(0,24))}…</code>`,`<button class="row-link" data-source="${esc(path)}">Read source →</button>`]))}</div><div class="card"><h3>Measurement definitions</h3><p class="fine">Analysis coverage = Σ(dimension weight × examined investigation weight / total planned investigation weight) / Σ(dimension weight). Examined: preliminary, corroborated, validated, inconclusive, contradicted, superseded. Started and not-examined investigations contribute zero. Any dimension without planned scope makes overall coverage Unknown.</p><p class="fine">Evidence validation = validated evidence / all evidence. Finding maturity = corroborated-or-validated findings / all findings. Open uncertainties = questions explicitly marked open; deferred questions remain separately visible. Decision gates met = met / all gates. No metrics imply implementation completion.</p></div>`;}
const components={overview,coverage,findings,risks,alternatives,economics,evolution,readiness,appendix};
function showSection(next){section=next;for(const [id]of titles){$('panel-'+id).hidden=id!==next;document.querySelector(`[data-nav="${id}"]`).classList.toggle('active',id===next);document.querySelector(`[data-nav="${id}"]`).setAttribute('aria-current',id===next?'page':'false');}const index=titles.findIndex(([id])=>id===next);$('section-number').textContent=String(index+1).padStart(2,'0');$('section-title').textContent=titles[index][1];$('global-search').value='';filter();history.replaceState(null,'','#'+next);}
function render(){snap=data.snapshots[selected];s=snap.state;m=snap.metrics;baseline=Math.max(0,Math.min(baseline,selected-1));$('program-title').textContent=s.program.title;$('program-subtitle').textContent=s.program.subtitle;$('report-period').textContent=snap.reportingPeriod+' / '+s.asOf;$('approval-label').textContent='Reviewed by '+snap.reviewer;$('snapshot-select').value=String(selected);$('sample-banner').textContent=s.program.exampleData?'SYNTHETIC DEMONSTRATION · All measurements, costs and compatibility observations are illustrative. This report tracks assessment research, not migration delivery.':'ASSESSMENT REPORT · Analysis and decision support. Approval of this report is not authorization to execute a migration.';$('footer-date').textContent=s.asOf;$('state-hash').textContent='Approved state SHA-256 '+snap.hash;$('panels').innerHTML=titles.map(([id,title])=>`<section id="panel-${id}" class="panel" data-print-title="${esc(title)}">${components[id]()}</section>`).join('');showSection(section);}
function filter(){const q=$('global-search').value.trim().toLowerCase();let shown=0,total=0;const status=$('finding-filter')?.value||'all';document.querySelectorAll('#panel-'+section+' .searchable').forEach(el=>{total++;let visible=el.textContent.toLowerCase().includes(q);if(section==='findings'&&el.dataset.findingId)visible=visible&&(status==='all'||el.dataset.status===status);el.hidden=!visible;if(visible)shown++;});$('search-count').textContent=q?`${shown}/${total}`:'';}
function sourceBlock(ref){const src=s.sources[ref.path];if(!src)return '<p>Source unavailable.</p>';return `<div class="source-head"><strong>${esc(ref.path)} · L${ref.startLine}–L${ref.endLine}</strong><p class="fine">SHA-256 ${esc(src.hash)}</p></div><pre>${esc(src.content.split('\n').slice(ref.startLine-1,ref.endLine).map((line,i)=>String(ref.startLine+i).padStart(4,' ')+'  '+line).join('\n'))}</pre><button class="row-link" data-download-source="${esc(ref.path)}">Download original Markdown</button>`;}
function openDetail(title,html){$('dialog-title').textContent=title;$('dialog-content').innerHTML=html;if(!$('evidence-dialog').open)$('evidence-dialog').showModal();}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('navigation').innerHTML=titles.map(([id,title],i)=>`<a class="nav-link" href="#${id}" data-nav="${id}"><span class="nav-num">${String(i+1).padStart(2,'0')}</span>${esc(title)}</a>`).join('');
$('snapshot-select').innerHTML=data.snapshots.map((x,i)=>`<option value="${i}">${esc(x.reportingPeriod)} · ${esc(x.state.asOf)}</option>`).join('');
$('snapshot-select').addEventListener('change',e=>{selected=+e.target.value;baseline=Math.max(0,selected-1);render();});
$('global-search').addEventListener('input',filter);
$('theme-toggle').addEventListener('click',()=>{document.body.classList.toggle('dark');try{localStorage.setItem('assess-theme',document.body.classList.contains('dark')?'dark':'light');}catch{}});
try{if(localStorage.getItem('assess-theme')==='dark')document.body.classList.add('dark');}catch{}
$('export-json').addEventListener('click',()=>download(`assessment-${snap.reportingPeriod}.json`,JSON.stringify(snap,null,2),'application/json'));
$('print-report').addEventListener('click',()=>window.print());$('close-dialog').addEventListener('click',()=>$('evidence-dialog').close());
document.addEventListener('change',e=>{if(e.target.id==='finding-filter')filter();if(e.target.id==='baseline-select'){baseline=+e.target.value;$('panel-evolution').innerHTML=evolution();filter();}});
document.addEventListener('click',e=>{const el=e.target.closest('a,button');if(!el)return;const d=el.dataset;if(d.nav){e.preventDefault();showSection(d.nav);}if(d.view)showSection(d.view);if(d.snapshot!==undefined){selected=+d.snapshot;baseline=Math.max(0,selected-1);render();}if(d.finding){if($('evidence-dialog').open)$('evidence-dialog').close();showSection('findings');const f=document.querySelector(`[data-finding-id="${d.finding}"]`);f?.scrollIntoView({behavior:'smooth',block:'center'});f?.setAttribute('tabindex','-1');f?.focus({preventScroll:true});}if(d.evidence){const ev=s.evidence[d.evidence];openDetail(ev.id+' · Evidence',`<p>${esc(ev.description)}</p><div class="tag-row">${badge(ev.verificationStatus)}${badge(ev.kind)}</div><p class="fine">Captured ${esc(ev.capturedAt)} · reviewer: ${esc(ev.reviewedBy)} · revision ${ev.revision}</p><div class="callout">Limitations: ${esc(ev.limitations)}</div>${ev.sourceRefs.map(sourceBlock).join('')}`);}if(d.record){const[c,id]=d.record.split(':');const r=s[c][id];openDetail(id+' · Record provenance',`<dl class="field-list"><dt>Revision</dt><dd>${r.revision}</dd><dt>Created / updated</dt><dd>${esc(r.createdAt)} / ${esc(r.updatedAt)}</dd></dl>${r.sourceRefs.map(sourceBlock).join('')||'<div class="callout warn">No direct source location. Evidence links carry supporting references.</div>'}<h3>Structured record</h3><pre>${esc(JSON.stringify(r,null,2))}</pre>`);}if(d.source){const src=s.sources[d.source];openDetail(d.source,sourceBlock({path:d.source,startLine:1,endLine:src.content.split('\n').length}));}if(d.downloadSource)download(d.downloadSource.split('/').pop(),s.sources[d.downloadSource].content,'text/markdown');});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(titles.some(([id])=>id===next))showSection(next);});
render();
})();

</script>
